name: Build Video Transcoder (Desktop)

on:
  push:
    branches: [ '**' ]  # all branches, but not tag pushes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Validate the app before spending time on platform builds
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Linux Tk support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Verify Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  # ============================================================================
  # Job 2: Generate version info from the package version
  # ============================================================================
  generate-version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and generate build info
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("src/video_transcoder/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit("__version__ not found in src/video_transcoder/__init__.py")
          print(match.group(1))
          PY
          )

          BUILD_NUM=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short HEAD)

          FULL_VERSION="${APP_VERSION}-build.${BUILD_NUM}"
          BUILD_TAG="vtr-v${APP_VERSION}-build.${BUILD_NUM}+${COMMIT_HASH}"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"

          # Only release on main branch push
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "App Version: $APP_VERSION"
          echo "Full Version: $FULL_VERSION"
          echo "Build Tag: $BUILD_TAG"

  # ============================================================================
  # Job 3: Windows Builds
  # ============================================================================
  build-windows-onedir:
    name: Windows Portable (onedir)
    runs-on: windows-latest
    needs: [generate-version, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install winshell pywin32

      - name: Build Windows Portable (onedir)
        shell: bash
        run: bash packaging/pyinstaller/build_onedir.sh

      - name: Create Windows Portable ZIP
        shell: pwsh
        run: |
          $mainFolder = "mt-vtr-Windows-Portable"
          if (Test-Path $mainFolder) { Remove-Item -Recurse -Force $mainFolder }
          New-Item -ItemType Directory -Path $mainFolder | Out-Null
          Copy-Item -Path "dist\mt-vtr\*" -Destination $mainFolder -Recurse -Force
          Compress-Archive -Path $mainFolder -DestinationPath "mt-vtr-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force $mainFolder

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt-vtr-Windows-Portable
          path: mt-vtr-Windows-Portable.zip

  build-windows-onefile:
    name: Windows Single File (onefile)
    runs-on: windows-latest
    needs: [generate-version, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install winshell pywin32

      - name: Build Windows Single File (onefile)
        shell: bash
        run: bash packaging/pyinstaller/build_onefile.sh

      - name: Upload Windows Single File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt-vtr-Windows-onefile
          path: dist/mt-vtr.exe

  # ============================================================================
  # Job 4: Linux Builds
  # ============================================================================
  build-linux-onedir:
    name: Linux Portable (onedir)
    runs-on: ubuntu-latest
    needs: [generate-version, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux Tk support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Verify Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Linux Portable (onedir)
        run: bash packaging/pyinstaller/build_onedir.sh

      - name: Create Linux Portable ZIP
        run: |
          rm -rf mt-vtr-Linux-Portable
          mkdir -p mt-vtr-Linux-Portable
          cp -r dist/mt-vtr/. mt-vtr-Linux-Portable/
          zip -r mt-vtr-Linux-Portable.zip mt-vtr-Linux-Portable
          rm -rf mt-vtr-Linux-Portable

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt-vtr-Linux-Portable
          path: mt-vtr-Linux-Portable.zip

  build-linux-onefile:
    name: Linux Single File (onefile)
    runs-on: ubuntu-latest
    needs: [generate-version, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux Tk support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Verify Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Linux Single File (onefile)
        run: bash packaging/pyinstaller/build_onefile.sh

      - name: Upload Linux Single File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt-vtr-Linux-onefile
          path: dist/mt-vtr

  # ============================================================================
  # Job 5: Create/Update Release (only if all builds succeed on main)
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - generate-version
      - build-windows-onedir
      - build-windows-onefile
      - build-linux-onedir
      - build-linux-onefile
    if: needs.generate-version.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts/

      - name: Prepare release files
        run: |
          cp artifacts/mt-vtr-Windows-Portable/mt-vtr-Windows-Portable.zip .
          cp artifacts/mt-vtr-Windows-onefile/mt-vtr.exe mt-vtr-Windows.exe
          cp artifacts/mt-vtr-Linux-Portable/mt-vtr-Linux-Portable.zip .
          cp artifacts/mt-vtr-Linux-onefile/mt-vtr mt-vtr-Linux
          chmod +x mt-vtr-Linux

          echo "Release files prepared:"
          ls -lh mt-vtr-Windows-Portable.zip mt-vtr-Windows.exe mt-vtr-Linux-Portable.zip mt-vtr-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transcoder-latest
          name: "MediaTools Video Transcoder - v${{ needs.generate-version.outputs.version }}"
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            # MediaTools Video Transcoder

            **Version:** ${{ needs.generate-version.outputs.version }}
            **Build Tag:** `${{ needs.generate-version.outputs.build_tag }}`
            **Commit:** ${{ github.sha }}

            ---

            All platform builds passed before this release was published.

            ## Available Downloads

            ### Windows

            1. **mt-vtr-Windows-Portable.zip** - Portable folder (`--onedir`)
               - Contains `mt-vtr.exe` plus all dependencies
               - Extract and run `mt-vtr.exe`

            2. **mt-vtr-Windows.exe** - Single executable (`--onefile`)
               - Self-contained file
               - Run directly

            ### Linux

            3. **mt-vtr-Linux-Portable.zip** - Portable folder (`--onedir`)
               - Contains the `mt-vtr` binary plus all dependencies
               - Extract and run `./mt-vtr`

            4. **mt-vtr-Linux** - Single executable (`--onefile`)
               - Single binary file
               - Run with `chmod +x mt-vtr-Linux && ./mt-vtr-Linux`

            ## Command-Line Usage

            ```bash
            mt-vtr.exe -help
            mt-vtr.exe -i input.mp4
            mt-vtr.exe -i input.mp4 -o output
            ```

            ## Usage Notes

            - Windows may show an antivirus false positive for unsigned executables.
            - Linux onefile users should make the binary executable with `chmod +x`.
            - Portable versions are recommended for better startup performance.
          files: |
            mt-vtr-Windows-Portable.zip
            mt-vtr-Windows.exe
            mt-vtr-Linux-Portable.zip
            mt-vtr-Linux
