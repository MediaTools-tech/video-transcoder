name: Build Video Transcoder (Docker)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_NAME: mt-vtr
  DOCKER_IMAGE_NAME: video-transcoder

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]" httpx

      - name: Validate container entrypoint
        run: sh -n docker/video-transcoder/entrypoint.sh

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  generate-version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and generate build info
        id: version
        run: |
          APP_VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("src/video_transcoder/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit("__version__ not found in src/video_transcoder/__init__.py")
          print(match.group(1))
          PY
          )

          BUILD_NUM=$(git rev-list --count HEAD)
          VERSION="${APP_VERSION}-build.${BUILD_NUM}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "📦 App Version: $APP_VERSION"
          echo "🏷️  Image Version: $VERSION"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, generate-version]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image names
        id: images
        run: |
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "images<<EOF"
            echo "ghcr.io/${OWNER}/${DOCKER_IMAGE_NAME}"
            if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
              echo "${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set build date
        id: builddate
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ needs.generate-version.outputs.should_release == 'true' }}
            type=raw,value=${{ needs.generate-version.outputs.version }},enable=${{ needs.generate-version.outputs.should_release == 'true' }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/video-transcoder/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.generate-version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.value }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Update Docker Hub Description
        if: github.event_name == 'push' && needs.generate-version.outputs.should_release == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          readme-filepath: ./docker/video-transcoder/README.md
          short-description: "FFmpeg video transcoding API and web UI"
        continue-on-error: true
