services:
  video-transcoder:
    build:
      context: ../..
      dockerfile: docker/video-transcoder/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ${DOCKER_IMAGE:-video-transcoder:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DEBUG: "${DEBUG:-false}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
    volumes:
      - ./storage:/storage
    security_opt:
      - no-new-privileges:true
